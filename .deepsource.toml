version = 1

exclude_patterns = [
  "node_modules/**",
  "public/**",
  "coverage/**",
  "styled-system/**"
]

# Anchored with a leading ** because the suites live beside the code
# they cover — src/domain/__tests__ and src/data/__tests__ — not in one
# directory at the repo root.
test_patterns = [
  "**/__tests__/**"
]

[[analyzers]]
  name = "javascript"
  enabled = true

  [analyzers.meta]
    plugins = ["react"]
    # The app is browser code; scripts/ is Node CLI tooling that reports
    # what it did on stdout. Without naming both, every console call in a
    # build script reads as browser debug output left behind — the three
    # in scripts/copy-maplibre-worker.mjs, where the console.error is the
    # whole point: it's what turns a half-staged MapLibre worker into a
    # failed build instead of a map that renders blank.
    #
    # The trade this makes: `environment` is per-analyzer, not per-path,
    # so there is no way to say "browser under src/, Node under
    # scripts/". Naming nodejs stops JS-0002 (no console in browser code)
    # firing anywhere, app code included. Nothing under src/ calls console
    # today, so the rule is giving up nothing right now — but it is
    # switched off there, not passing. If console statements start
    # appearing in components, scope the rule in the DeepSource dashboard
    # rather than assuming this file still guards it.
    environment = [
      "browser",
      "nodejs"
    ]
