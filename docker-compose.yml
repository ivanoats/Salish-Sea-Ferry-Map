version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional: Add your WSF API key here or in a .env file
      # WSF_API_KEY: ${WSF_API_KEY}
      NODE_ENV: production
    # For production deployment, comment out restart policy
    restart: unless-stopped
    # For development with hot reload, uncomment:
    # volumes:
    #   - ./src:/app/src
    # develop:
    #   watch:
    #     - path: ./src
    #       action: rebuild
