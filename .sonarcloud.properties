# Configuration for SonarQube Cloud's Automatic Analysis.
#
# This is deliberately NOT sonar-project.properties — that file is read
# only by CI-based analysis, and this project uses Automatic Analysis,
# which ignores it. Settings here override the equivalents in the
# SonarQube Cloud UI. PR #57 verified that changes here apply to PR analysis.

# Exclusions for copy-paste detection.
#
# The ferry dataset is a hand-curated list of records with intentionally
# repeated object shapes. Sonar's copy-paste detector reads that shape as
# duplication
# and is not wrong about the text — routes.ts alone accounts for 338
# duplicated lines and operators.ts another 49 — but there is nothing to
# extract. The repetition IS the data, and the alternative (generating
# records from some terser source) would trade a readable, reviewable,
# greppable dataset for indirection.
#
# Left unexcluded this blocks every dataset PR: adding one operator and
# one route to a seven-operator file put new duplicated lines at 48.7%
# against a 3% quality gate, with zero actual issues raised.
#
# Paths are explicit so validation code and tests still receive duplication checks.
# The GTFS snapshot is generated from hash-verified archives; its repeated records
# are data, with reproducibility checked in CI.
sonar.cpd.exclusions=src/data/operators.ts,src/data/routes.ts,src/data/terminals.ts,src/data/generated/gtfs.ts

# Talk decks are build output, not source.
#
# talks/<talk>/ holds a generated reveal.js deck twice over: once as a
# single self-contained HTML file for offline use and once split into
# cacheable files in web/ for the site. The two copies duplicate each other
# by design, and both bundle vendored reveal.js. Analysing them measured
# 41.8% duplication on PR #76 against a 3% gate, none of it code anyone
# here maintains. ESLint ignores the same folders (eslint.config.mjs).
sonar.exclusions=talks/**
