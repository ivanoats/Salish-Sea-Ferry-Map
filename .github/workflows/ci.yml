name: CI

on:
  pull_request:
  push:
    branches: [main]

# Let a new push supersede an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Read-only: nothing here writes to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Both flags are upstream quirks, documented in netlify.toml:
      # --legacy-peer-deps dodges an npm bug in vitest 4's peer graph, and
      # --ignore-scripts skips @park-ui/panda-preset's broken postinstall.
      # Skipping scripts also skips this project's own postinstall, but
      # every script below runs `panda codegen` first where it needs to.
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pinned GTFS
        run: npm run check-gtfs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails if coverage drops below the floors in vitest.config.ts.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Same flags as the check job above; see the comment there.
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Playwright starts the standalone server itself (playwright.config.ts).
      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
