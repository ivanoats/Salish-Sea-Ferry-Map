name: CI

on:
  pull_request:
  push:
    branches: [main]

# Let a new push supersede an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Read-only: nothing here writes to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Both flags are upstream quirks, documented in netlify.toml:
      # --legacy-peer-deps dodges an npm bug in vitest 4's peer graph, and
      # --ignore-scripts skips @park-ui/panda-preset's broken postinstall.
      # Skipping scripts also skips this project's own postinstall, but
      # every script below runs `panda codegen` first where it needs to.
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
